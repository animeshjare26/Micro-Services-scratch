# =====================================================================================
# FILE: application.yml
# MODULE: user-service
# PURPOSE: Central configuration for server port, database connections, JPA, Flyway, and JWT secrets.
#
# READING ORDER:
# - Read PREVIOUS: pom.xml
# - Read THIS FILE: Understand runtime properties and JWT expiration policies.
#
# TRICKY INTERVIEW QUESTIONS & ARCHITECTURAL WISDOM:
# Q1: Why is `hibernate.ddl-auto` set to `validate` instead of `update`?
# A1: In production systems, `update` is dangerous because Hibernate might modify tables,
#     lock schemas, or silently fail on type alterations without rollback capability.
#     Using `validate` ensures Hibernate strictly verifies the JPA entities match the
#     database schema created by version-controlled Flyway migration scripts!
#
# Q2: Why are JWT secrets Base64 encoded?
# A2: HMAC-SHA algorithms require keys with sufficient cryptographic entropy (at least 256 bits).
#     Encoding the raw binary bytes as Base64 allows safe storage and transport as readable text.
# =====================================================================================


server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: user-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Connection pool tuning for high concurrency
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

#  flyway:
#    enabled: true
#    baseline-on-migrate: true
#    locations: classpath:db/migration

# JSON Web Token Expiration & Cryptographic Key Configuration
jwt:
  # RSA Asymmetric 2048-bit Keypair (RS256) for Access Token signing (loaded from env or mounted volume)
  rsa:
    private-key-path: ${JWT_RSA_PRIVATE_KEY_PATH:classpath:certs/private_key.pem}
    public-key-path: ${JWT_RSA_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION:15} # 15 minutes
  refresh:
    secret: ${JWT_REFRESH_SECRET:dGhpc0lzQVNhbXBsZVJlZnJlc2hTZWNyZXRLZXlGb3JEZXZlbG9wbWVudDEyMzQ1Njc4OTAxMjM0NTY=}
    expiration: ${JWT_REFRESH_EXPIRATION:10080} # 7 days (in minutes)
  forgot_password:
    secret: ${JWT_FORGOT_PASSWORD_SECRET:dGhpc0lzQVNhbXBsZUZvcmdvdFBhc3N3b3JkU2VjcmV0S2V5Rm9yRGV2MTIzNDU2Nzg5MDEyMzQ1Ng==}
    expiration: ${JWT_FORGOT_PASSWORD_EXPIRATION:30} # 30 minutes

